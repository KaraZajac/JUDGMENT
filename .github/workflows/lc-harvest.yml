name: lc-harvest

# Daily: the decision-day pipeline (new decisions, grants, votes, transcripts,
# scoring) plus the lower-court opinions, for the cases on the docket first and
# then a tranche of the 2017-2024 training corpus.
#
# CourtListener allows 5 requests/min, 50/hour and 125/day per account, as
# rolling windows shared by every job. pipeline/courtlistener.py asks the
# account's usage API before spending, keeps 25 of the 125 in reserve, counts
# retries, and stops at the first 429. Every case's outcome is committed
# (data/text/lc-matches.yaml, lc-pending.yaml), so each run picks up where the
# last stopped; once 2017-2024 is done the harvest has nothing left to fetch.

on:
  schedule:
    - cron: "0 9 * * *" # daily 09:00 UTC
  workflow_dispatch:

# one CourtListener job at a time (shared with refresh.yml): they share its limits
concurrency:
  group: courtlistener
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    env:
      COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install pyyaml
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: Download SCDB sources (case list for matching)
        run: python -m pipeline.download

      # decision-day pipeline: during the term, decisions land any weekday —
      # ingest them, parse same-day votes from the syllabi, refresh rollups,
      # and score any decided forecasts within 24h instead of waiting for the
      # weekly refresh
      - name: Interim ingest (new decisions, grants, schedules)
        run: python -m pipeline.interim

      # after the interim ingest, so new grants are on the docket; the
      # docket's cases go first and the 2017-2024 backfill gets what is left
      - name: Lower-court opinions (docket cases, then a harvest tranche)
        run: python -m pipeline.lc_opinions --pending --harvest --start 2017 --budget 100

      - name: Same-day votes from slip-opinion syllabi (validation-gated)
        run: python -m pipeline.syllabus

      - name: Oral-argument transcripts for just-argued cases
        run: python -m pipeline.oral_args --current --budget 300

      - name: Aggregates
        run: python -m pipeline.aggregates

      - name: Score decided forecasts
        run: python -m models.score

      - name: Commit changes
        run: |
          git config user.name "judgment-daily"
          git config user.email "actions@users.noreply.github.com"
          git add -A data models/output
          if git diff --cached --quiet -I'^generated:' -I'^downloaded:' -I'^  downloaded:'; then
            echo "no substantive changes"
          else
            git commit -m "chore: daily ingest + harvest (automated)"
            # main may have moved during a multi-hour run (2026-07-07: eight
            # interactive commits landed mid-run and the push was rejected,
            # losing the tranche) — rebase and retry; fail loudly on conflict
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main || exit 1
              [ "$i" = 3 ] && exit 1
            done
          fi
